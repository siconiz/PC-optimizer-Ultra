name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # Actions > release > Run workflow: builds core/version.py's version and creates tag v<version>
    inputs:
      publish:
        description: "Create the GitHub release (off: only keep the installer as a workflow artifact)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Check tag matches core/version.py
        shell: pwsh
        run: |
          $code = python -c "from core.version import __version__; print(__version__)"
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            if ($v -ne $code) { throw "Tag $v does not match core/version.py ($code)" }
          } else { $v = $code }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          "TAG=v$v" >> $env:GITHUB_ENV

      - name: Download PresentMon
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.6.0 -R GameTechDev/PresentMon -p "PresentMon-2.6.0-x64.exe" -D tools
          Invoke-WebRequest https://raw.githubusercontent.com/GameTechDev/PresentMon/main/LICENSE.txt -OutFile tools/PresentMon-LICENSE.txt

      - name: Download LibreHardwareMonitorLib and PawnIO
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.6 -R LibreHardwareMonitor/LibreHardwareMonitor -p "LibreHardwareMonitor.zip" -D lhm-zip
          Expand-Archive lhm-zip/LibreHardwareMonitor.zip lhm-zip/x
          New-Item -ItemType Directory -Force tools/lhm | Out-Null
          Get-ChildItem lhm-zip/x/*.dll | Where-Object { $_.Name -notmatch '^(Aga\.|OxyPlot|Microsoft\.Win32\.TaskScheduler)' } |
            Copy-Item -Destination tools/lhm
          Invoke-WebRequest https://raw.githubusercontent.com/LibreHardwareMonitor/LibreHardwareMonitor/master/LICENSE -OutFile tools/lhm/LICENSE-MPL-2.0.txt
          Invoke-WebRequest https://raw.githubusercontent.com/LibreHardwareMonitor/LibreHardwareMonitor/master/THIRD-PARTY-NOTICES.txt -OutFile tools/lhm/THIRD-PARTY-NOTICES.txt
          gh release download -R namazso/PawnIO.Setup -p "PawnIO_setup.exe" -D tools
          Invoke-WebRequest https://raw.githubusercontent.com/namazso/PawnIO/master/COPYING -OutFile tools/PawnIO-LICENSE.txt

      - name: Build app
        run: python build.py

      # Code signing: add the SignPath signing step here once the project is approved.

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          & $nsis "/DVERSION=$env:APP_VERSION" installer.nsi
          if ($LASTEXITCODE) { throw "makensis failed" }

      - name: Keep the installer as an artifact
        if: github.event_name != 'push' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/PCOptimizer-Setup-*.exe

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "PCOptimizer-Setup-$env:APP_VERSION.exe"
          $f = "dist\$name"
          $fixed = "dist\PCOptimizer-Setup.exe"  # same file under a fixed name: the README links to latest/download/PCOptimizer-Setup.exe
          Copy-Item $f $fixed
          $hash = (Get-FileHash $f -Algorithm SHA256).Hash
          foreach ($x in $f, $fixed) { $hash | Out-File "$x.sha256" -Encoding ascii }
          $notes = @'
          ## Download

          **[{name}](https://github.com/{repo}/releases/download/{tag}/{name})** (Windows 10 / 11, 64-bit)

          SHA-256: `{hash}`

          Check it in PowerShell: `(Get-FileHash "$env:USERPROFILE\Downloads\{name}").Hash` must show the same value.
          The installer is not code-signed yet: if SmartScreen warns, choose **More info** > **Run anyway**.
          '@
          $notes = $notes.Replace('{name}', $name).Replace('{repo}', "${{ github.repository }}").Replace('{tag}', $env:TAG).Replace('{hash}', $hash)
          $main = gh api "repos/${{ github.repository }}/commits/main" -q .sha  # tag on main: the release carries only the new installer
          gh release create $env:TAG --target $main $f "$f.sha256" $fixed "$fixed.sha256" --notes $notes --generate-notes
